name: Collect Tube status

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # backup schedule (GitHub may delay or skip these)
  workflow_dispatch:                # main trigger: started every 15 minutes by cron-job.org

permissions:
  contents: write                   # allows the workflow to save new data files to the repo

concurrency:
  group: collect-tube-status        # never run two collections at the same time
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10             # stop a stuck run instead of letting it hang
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install collector packages only
        run: pip install requests python-dotenv

      - name: Collect line status
        env:
          TFL_APP_KEY: ${{ secrets.TFL_APP_KEY }}
        run: python collect.py

      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Collect Tube status $(date -u +'%Y-%m-%dT%H:%MZ')" || exit 0
          git pull --rebase
          git push