name: Collect Tube status

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (UTC)
  workflow_dispatch:          # also lets you run it manually from GitHub

permissions:
  contents: write             # allows the workflow to save new data files to the repo

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Collect line status
        env:
          TFL_APP_KEY: ${{ secrets.TFL_APP_KEY }}
        run: python collect.py

      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Collect Tube status $(date -u +'%Y-%m-%dT%H:%MZ')" || echo "No changes"
          git push